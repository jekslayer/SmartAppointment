<div class="min-h-screen bg-gradient-admin flex-center p-4 relative overflow-hidden">
  <!-- Decorative elements -->
  <div class="decorative-bg">
    <div class="decorative-circle circle-1-admin"></div>
    <div class="decorative-circle circle-2-admin"></div>
    <div class="decorative-circle circle-3-admin"></div>
  </div>

  <div class="card">
    <div class="card-header text-center">
      <div class="icon-container bg-gradient-admin-icon">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2 class="card-title">Admin Panel</h2>
      <p class="card-subtitle-admin">ระบบจัดการสำหรับผู้ดูแลระบบ</p>
    </div>

    <div class="card-content">
      <form (ngSubmit)="handleLogin($event)" class="form">
        <div class="form-group">
          <label class="form-label-admin">ชื่อผู้ใช้</label>
          <input
            [value]="username()"
            (input)="username.set($any($event.target).value)"
            placeholder="กรอกชื่อผู้ใช้"
            class="form-input-admin"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label-admin">รหัสผ่าน</label>
          <div class="input-wrapper-admin">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            placeholder="กรอกรหัสผ่าน"
            class="form-input-admin"
            required
          />
          <button type="button" class="password-toggle-admin" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน'" [attr.aria-pressed]="showPassword()">
            @if (showPassword()) { <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.2 12s3.4-6 9.8-6 9.8 6 9.8 6-3.4 6-9.8 6-9.8-6-9.8-6Z"/><circle cx="12" cy="12" r="2.8"/></svg> }
            @else { <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6.4 0 9.8 6 9.8 6a18 18 0 0 1-3.3 3.8M6.2 8.1A18.4 18.4 0 0 0 2.2 12s3.4 6 9.8 6c1.4 0 2.6-.3 3.6-.7M9.7 9.7a3.3 3.3 0 0 0 4.6 4.6"/></svg> }
          </button>
          </div>
        </div>

        @if (error()) {
          <div class="alert alert-error-admin">
            <span class="alert-text">{{ error() }}</span>
          </div>
        }

        <button 
          type="submit" 
          class="btn btn-admin"
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <svg class="spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>กำลังเข้าสู่ระบบ...</span>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            <span>เข้าสู่ระบบ</span>
          }
        </button>
      </form>

      <div class="footer footer-admin">
        <a (click)="navigateToStaffLogin()" class="footer-link-admin">
          ← กลับหน้าเข้าสู่ระบบเจ้าหน้าที่
        </a>
      </div>
    </div>
  </div>
</div>
